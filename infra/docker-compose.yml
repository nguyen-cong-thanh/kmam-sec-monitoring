name: kmam

services:
  app:
    build: ./app
    env_file: ../.env
    volumes:
      - /var/log/kmam/app:/var/log/kmam/app
    networks: [kmam]
    restart: unless-stopped

  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/log/kmam/nginx:/var/log/kmam/nginx
    ports:
      - "80:80"             # branch 1 (direct), published to the LAN
      - "127.0.0.1:8081:8081" # branch 2 (cf), reached only by cloudflared on the host
    depends_on: [app]
    networks: [kmam]
    restart: unless-stopped

networks:
  kmam:
    ipam:
      config:
        # Fixed subnet: host-side traffic to published ports arrives from the
        # gateway 172.31.0.1, which nginx trusts for CF-Connecting-IP.
        - subnet: 172.31.0.0/24
