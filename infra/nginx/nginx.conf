worker_processes auto;
error_log /dev/stderr warn;

events {}

http {
    # Both vhosts use the built-in "combined" format so that Wazuh's
    # stock web-accesslog decoder can parse them.

    # Branch 1: direct LAN access. No real_ip: $remote_addr is the TCP peer.
    server {
        listen 80 default_server;
        access_log /var/log/kmam/nginx/access-direct.log combined;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Branch 2: via Cloudflare Tunnel. Published on 127.0.0.1 only; cloudflared
    # on the host connects through the Docker gateway, so CF-Connecting-IP is
    # trusted from that address only.
    server {
        listen 8081;
        server_name monitor-lab.nguyencongthanh.io.vn;
        access_log /var/log/kmam/nginx/access-cf.log combined;

        set_real_ip_from 172.31.0.1;
        real_ip_header CF-Connecting-IP;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
