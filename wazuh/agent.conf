<!-- Centralized config for agents in group "default", mounted into the
     manager at /var/ossec/etc/shared/default/agent.conf. -->
<agent_config>
  <!-- Nginx access logs, "combined" format, parsed by the stock web-accesslog decoder. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kmam/nginx/access-direct.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kmam/nginx/access-cf.log</location>
  </localfile>

  <!-- Login events written by the Go app, one JSON object per line. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/kmam/app/auth.json</location>
  </localfile>
</agent_config>
